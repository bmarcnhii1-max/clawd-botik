name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - run: python -m py_compile ai_client.py bubble.py config.py dialogs.py i18n.py main.py make_icon.py pet_window.py phrases.py sprite.py
      - run: QT_QPA_PLATFORM=offscreen python -m pytest tests -q
      - name: Create icon
        run: QT_QPA_PLATFORM=offscreen python make_icon.py
      - name: Build executable
        run: QT_QPA_PLATFORM=offscreen python -m PyInstaller --noconfirm --clean --onefile --windowed --name Clawd --icon clawd.ico main.py
      - name: Package
        run: |
          chmod +x dist/Clawd
          tar -czf Clawd-linux.tar.gz -C dist Clawd
      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-linux-x64
          path: Clawd-linux.tar.gz
          if-no-files-found: error

  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Secret scan
        run: |
          pip install detect-secrets
          detect-secrets scan > secrets.tmp
          Get-Content secrets.tmp
          if (Select-String -Path secrets.tmp -Pattern "sk-[A-Za-z0-9]{8,}") { throw "Potential secret found" }

      - name: Compile check
        run: python -m py_compile ai_client.py bubble.py config.py dialogs.py i18n.py main.py make_icon.py pet_window.py phrases.py sprite.py

      - name: Tests
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest tests -q

      - name: Create icon
        run: python make_icon.py

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Clawd --icon clawd.ico main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clawd-windows-x64
          path: dist/Clawd.exe
          if-no-files-found: error
